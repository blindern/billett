@if (paymentgroups.isLoading()) {
  <div class="form-control-static">Laster oppgjørsgrupper ...</div>
} @else if (paymentgroups.error()) {
  <div class="form-control-static">Feil: {{ getErrorText(paymentgroups.error()) }}</div>
} @else if (paymentgroups.hasValue()) {
  <select
    class="form-control"
    [ngModel]="paymentgroup()?.id ?? ''"
    (ngModelChange)="select($event)"
    name="selectedPaymentgroupId"
  >
    @if (!paymentgroup()) {
      <option value="">Velg ...</option>
    }
    @for (g of paymentgroups.value(); track g.id) {
      <option [ngValue]="g.id">
        {{ g.time_start | formatdate: "DD.MM.YYYY HH:mm" }} ({{ g.user_created }}): {{ g.title }}
      </option>
    }
  </select>
  <span class="help-block">
    <button class="btn btn-link" type="button" style="padding: 0" (click)="createNew()">Opprett ny</button>
  </span>
}
