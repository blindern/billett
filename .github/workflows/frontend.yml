name: frontend
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"
      # The @render suite runs in this job against the build produced below.
      - "e2e-tests/**"
jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm run build

      # Runs here rather than via run-e2e-tests.yml because it needs the dist/ this job
      # just produced; that workflow runs on a separate runner with no access to it.
      - name: Install e2e dependencies
        working-directory: e2e-tests
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: e2e-tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Render tests
        working-directory: e2e-tests
        env:
          RENDER_SERVER: "1"
          BASE_URL: http://localhost:4200
        # No retries: these tests are hermetic, so a retry only masks a real failure
        # and the retryDelay fixture makes each one progressively slower.
        run: pnpm exec playwright test --grep @render --retries 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: render-playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 7

      - name: Build docker image
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/blindern/billett-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl -sS -i -N -L -H "authorization: bearer $DEPLOYER_TOKEN" -H "content-type: application/json" -X POST "https://deployer.foreningenbs.no/deploy?stream" -d '
          {
            "service": "uka-billett",
            "attributes": {
              "frontend_image": "ghcr.io/blindern/billett-frontend@${{ steps.docker_build.outputs.digest }}"
            }
          }' | tee /tmp/deploy-output.txt
          tail -1 /tmp/deploy-output.txt | grep -q "DEPLOY OK"
        env:
          DEPLOYER_TOKEN: ${{ secrets.DEPLOYER_TOKEN }}

  e2e-tests:
    if: github.ref == 'refs/heads/main'
    needs: frontend
    permissions:
      contents: read
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      tag: "@frontend"
    secrets: inherit
