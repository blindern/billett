name: E2E Tests
on:
  workflow_dispatch:
  schedule:
    # Skip Zincati reboot windows for fcos-1/2/3/fbshs1 (01-05 Europe/Oslo
    # = 23-04 UTC summer / 00-05 UTC winter). Gatus monitors externally.
    - cron: "35 5-22 * * *"
  push:
    paths:
      - ".github/workflows/e2e-tests.yml"
      - "e2e-tests/**"

defaults:
  run:
    working-directory: ./e2e-tests

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: "e2e-tests/package.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "e2e-tests/pnpm-lock.yaml"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # @render needs a locally served build with mocked APIs; it must never run
      # against production.
      - run: pnpm exec playwright test --grep-invert @render
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure()
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-type: application/json" \
            --data '{"channel":"C0AAS4Q42RJ","text":"❌ E2E tests failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            https://slack.com/api/chat.postMessage
