name: Run E2E Tests
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to filter tests (e.g., '@api' or '@frontend')"
        required: true
        type: string
      retries:
        description: "Number of retries"
        required: false
        type: number
        default: 3

defaults:
  run:
    working-directory: ./e2e-tests

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: "e2e-tests/package.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "e2e-tests/pnpm-lock.yaml"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --grep "${{ inputs.tag }}" --retries ${{ inputs.retries }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 7
      - name: Notify Slack on failure
        if: failure()
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-type: application/json" \
            --data '{"channel":"C0AAS4Q42RJ","text":"❌ E2E tests failed (${{ inputs.tag }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            https://slack.com/api/chat.postMessage
